<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Stream - AniWave Style</title>
  <style>
    :root {
      --bg-color: #0f0f13;
      --card-bg: #181820;
      --accent-color: #5b51d8;
      --accent-hover: #7267f0;
      --text-color: #e2e2e8;
      --text-muted: #8c8c9e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Header Styling */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #282835;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    /* Player Container */
    .player-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .player-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Server Selection Box */
    .server-box {
      background-color: var(--card-bg);
      margin-top: 15px;
      padding: 15px;
      border-radius: 8px;
    }

    .server-title {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .server-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .server-label {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--accent-color);
      min-width: 45px;
    }

    .server-btn {
      background-color: #23232f;
      color: var(--text-color);
      border: 1px solid #323242;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .server-btn:hover {
      background-color: #2d2d3d;
    }

    .server-btn.active {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
      color: #fff;
    }

    /* Anime Info Section */
    .anime-info {
      margin-top: 20px;
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
    }

    .anime-title {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }

    .anime-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">AnimeHindi</div>
    </header>

    <!-- Video Player -->
    <div class="player-wrapper">
      <iframe id="anime-player" src="" allowfullscreen scrolling="no"></iframe>
    </div>

    <!-- Server Controls -->
    <div class="server-box">
      <div class="server-title">Streaming Servers (If stream buffers, switch server)</div>
      
      <div class="server-group">
        <span class="server-label">SUB:</span>
        <button class="server-btn active" onclick="changeServer('vidsrc', this)">Server 1 (VidSrc)</button>
        <button class="server-btn" onclick="changeServer('autoembed', this)">Server 2 (AutoEmbed)</button>
        <button class="server-btn" onclick="changeServer('embedsu', this)">Server 3 (EmbedSU)</button>
      </div>
    </div>

    <!-- Details -->
    <div class="anime-info">
      <h1 class="anime-title" id="title-display">Jujutsu Kaisen - Episode 1</h1>
      <p class="anime-desc">A boy fights... for "the right death." Hardship, regret, shame: the negative feelings that humans feel become Curses that lurk in our everyday lives.</p>
    </div>
  </div>

  <script>
    // Configuration: Set TMDB ID or AniList ID and Episode Number
    const currentAnime = {
      tmdbId: "37854", // Example: Jujutsu Kaisen TMDB ID
      episode: 1
    };

    const serverUrls = {
      vidsrc: (id, ep) => `https://vidsrc.cc/v2/embed/anime/${id}/${ep}`,
      autoembed: (id, ep) => `https://player.autoembed.cc/embed/anime/${id}/${ep}`,
      embedsu: (id, ep) => `https://embed.su/embed/anime/${id}/${ep}`
    };

    const iframe = document.getElementById('anime-player');

    function loadVideo(serverKey) {
      if (serverUrls[serverKey]) {
        iframe.src = serverUrls[serverKey](currentAnime.tmdbId, currentAnime.episode);
      }
    }

    function changeServer(serverKey, btnElement) {
      // Update active button state
      document.querySelectorAll('.server-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      // Load new embed URL
      loadVideo(serverKey);
    }

    // Initial load
    loadVideo('vidsrc');
  </script>
</body>
</html>
