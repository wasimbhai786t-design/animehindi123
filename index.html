<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Pro Anime Hindi — Anime Discovery</title>
<meta name="description" content="Pro Anime Hindi — discover anime, genres, seasons, episodes and build your watchlist.">

<style>
:root{
  --bg:#07080d;
  --card:#10121a;
  --card2:#171a24;
  --border:#272b38;
  --text:#fff;
  --muted:#9b9eaa;
  --accent:#8b5cf6;
  --accent2:#b197ff;
  --danger:#ef4444;
  --green:#22c55e;
}

*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
}

button,input,select{font:inherit}

button{cursor:pointer}

a{
  color:inherit;
  text-decoration:none;
}

/* NAVBAR */

.navbar{
  position:sticky;
  top:0;
  z-index:1000;
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  background:rgba(7,8,13,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.logo{
  font-size:21px;
  font-weight:900;
  letter-spacing:.5px;
}

.logo span{color:var(--accent2)}

.navlinks{
  display:flex;
  gap:26px;
}

.navlinks a{
  color:#c8cad2;
  font-size:14px;
  transition:.2s;
}

.navlinks a:hover{color:white}

.nav-btn{
  border:0;
  background:var(--accent);
  color:white;
  padding:10px 17px;
  border-radius:10px;
  font-weight:700;
}

/* HERO */

.hero{
  min-height:520px;
  padding:90px 6%;
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 75% 40%,rgba(139,92,246,.22),transparent 35%),
    radial-gradient(circle at 15% 30%,rgba(67,56,202,.12),transparent 30%);
}

.hero-content{max-width:680px}

.badge{
  display:inline-block;
  padding:7px 12px;
  border:1px solid rgba(177,151,255,.3);
  background:rgba(139,92,246,.1);
  color:var(--accent2);
  border-radius:999px;
  font-size:12px;
  margin-bottom:18px;
}

.hero h1{
  font-size:clamp(42px,7vw,78px);
  line-height:1.02;
  margin-bottom:18px;
}

.hero h1 span{color:var(--accent2)}

.hero p{
  color:var(--muted);
  max-width:560px;
  font-size:17px;
  margin-bottom:28px;
}

.hero-actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.primary{
  border:0;
  background:var(--accent);
  color:white;
  padding:13px 20px;
  border-radius:11px;
  font-weight:800;
}

.secondary{
  border:1px solid var(--border);
  background:var(--card);
  color:white;
  padding:13px 20px;
  border-radius:11px;
}

/* GENERAL */

.container{
  width:88%;
  max-width:1250px;
  margin:auto;
}

.section{
  padding:55px 0;
}

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:25px;
}

.section-head h2{
  font-size:28px;
}

.section-head p{
  color:var(--muted);
  font-size:13px;
}

/* SEARCH */

.search-area{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:28px;
}

.search{
  flex:1;
  min-width:220px;
  background:var(--card);
  border:1px solid var(--border);
  color:white;
  padding:13px 15px;
  border-radius:11px;
  outline:none;
}

.search:focus{border-color:var(--accent)}

.select{
  background:var(--card);
  border:1px solid var(--border);
  color:white;
  padding:13px;
  border-radius:11px;
  min-width:150px;
}

/* CARDS */

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  overflow:hidden;
  transition:.25s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#49415e;
}

.poster{
  height:265px;
  display:flex;
  align-items:flex-end;
  padding:15px;
  position:relative;
  background:
    linear-gradient(135deg,#312e81,#111827 55%,#581c87);
}

.poster:nth-child(2n){background:linear-gradient(135deg,#164e63,#111827,#4c1d95)}
.poster:nth-child(3n){background:linear-gradient(135deg,#7c2d12,#111827,#312e81)}

.poster-title{
  font-size:22px;
  font-weight:900;
  max-width:90%;
  text-shadow:0 3px 12px #000;
}

.rating{
  position:absolute;
  top:12px;
  right:12px;
  background:rgba(0,0,0,.7);
  padding:6px 8px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
}

.card-body{padding:15px}

.card-body h3{
  font-size:17px;
  margin-bottom:5px;
}

.meta{
  color:var(--muted);
  font-size:12px;
  margin-bottom:12px;
}

.card-actions{
  display:flex;
  gap:8px;
}

.card-actions button{
  flex:1;
  border:1px solid var(--border);
  background:var(--card2);
  color:white;
  padding:9px;
  border-radius:8px;
  font-size:12px;
}

.card-actions .watch{
  background:var(--accent);
  border-color:var(--accent);
}

/* GENRES */

.genre-grid{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.genre{
  border:1px solid var(--border);
  background:var(--card);
  color:#ddd;
  padding:10px 15px;
  border-radius:999px;
  transition:.2s;
}

.genre:hover,.genre.active{
  background:var(--accent);
  border-color:var(--accent);
  color:white;
}

/* FEATURE */

.feature{
  background:
    linear-gradient(110deg,rgba(139,92,246,.2),transparent),
    var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:30px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:25px;
  align-items:center;
}

.feature h2{
  font-size:30px;
  margin-bottom:8px;
}

.feature p{color:var(--muted)}

/* EMPTY */

.empty{
  text-align:center;
  padding:45px 15px;
  color:var(--muted);
  border:1px dashed var(--border);
  border-radius:15px;
  display:none;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  backdrop-filter:blur(8px);
  z-index:2000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{display:flex}

.modal-box{
  width:min(850px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  position:relative;
}

.modal-top{
  min-height:260px;
  padding:35px;
  display:flex;
  align-items:end;
  background:linear-gradient(135deg,#312e81,#111827,#581c87);
}

.close{
  position:absolute;
  right:18px;
  top:18px;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:20px;
}

.modal-info{padding:28px}

.modal-info h2{
  font-size:30px;
  margin-bottom:8px;
}

.modal-info p{
  color:var(--muted);
  margin:12px 0 20px;
}

.stats{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.stat{
  background:var(--card2);
  border:1px solid var(--border);
  padding:7px 10px;
  border-radius:8px;
  font-size:12px;
}

/* EPISODES */

.episodes{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:15px;
}

.episode{
  background:var(--card2);
  border:1px solid var(--border);
  color:white;
  padding:10px;
  border-radius:8px;
}

.episode:hover{
  border-color:var(--accent);
}

/* FOOTER */

footer{
  margin-top:50px;
  padding:40px 6% 80px;
  border-top:1px solid var(--border);
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.footer-logo{
  color:white;
  font-size:20px;
  font-weight:900;
  margin-bottom:8px;
}

/* MOBILE NAV */

.mobile-nav{
  display:none;
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  z-index:1500;
  background:rgba(10,11,17,.95);
  backdrop-filter:blur(15px);
  border-top:1px solid var(--border);
  grid-template-columns:repeat(4,1fr);
}

.mobile-nav button{
  border:0;
  background:none;
  color:var(--muted);
  font-size:11px;
}

.mobile-nav button:hover{color:white}

/* RESPONSIVE */

@media(max-width:1000px){
  .grid{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:700px){
  .navbar{
    padding:0 5%;
  }

  .navlinks,.nav-btn{display:none}

  .hero{
    min-height:500px;
    padding:70px 6%;
  }

  .hero h1{font-size:46px}

  .container{width:90%}

  .grid{grid-template-columns:repeat(2,1fr);gap:12px}

  .poster{height:220px}

  .feature{
    grid-template-columns:1fr;
  }

  .episodes{grid-template-columns:repeat(2,1fr)}

  .mobile-nav{display:grid}

  footer{padding-bottom:90px}
}

@media(max-width:430px){
  .grid{grid-template-columns:1fr 1fr}

  .poster{
    height:190px;
  }

  .poster-title{font-size:17px}

  .card-body{padding:11px}

  .card-body h3{font-size:14px}

  .hero h1{font-size:40px}

  .section{padding:40px 0}
}
</style>
</head
