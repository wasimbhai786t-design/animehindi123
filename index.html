<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AnimeHindi123</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#08080d;
  color:#fff;
  font-family:Arial,sans-serif;
}
header{
  position:sticky;
  top:0;
  z-index:10;
  background:#101018;
  border-bottom:1px solid #292936;
  padding:15px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{
  color:#ff326d;
  font-size:25px;
  font-weight:900;
}
nav a{
  color:#ddd;
  text-decoration:none;
  margin-left:18px;
}
.hero{
  padding:80px 7%;
  min-height:350px;
  display:flex;
  align-items:center;
  background:
  linear-gradient(90deg,#08080d 15%,transparent),
  url("https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=1600&q=80")
  center/cover;
}
.hero h1{
  font-size:clamp(42px,7vw,75px);
}
.hero span{color:#ff326d}
.hero p{
  max-width:600px;
  color:#ccc;
  line-height:1.6;
  margin:15px 0 25px;
}
.btn{
  background:#ff326d;
  color:white;
  padding:13px 22px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
}
main{padding:40px 5%}
.search{
  display:flex;
  gap:10px;
  margin:20px 0 30px;
}
input{
  flex:1;
  background:#15151e;
  border:1px solid #333342;
  color:white;
  padding:14px;
  border-radius:8px;
  outline:none;
}
button{
  border:0;
  background:#ff326d;
  color:white;
  padding:0 22px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:20px;
}
.card{
  background:#15151e;
  border:1px solid #292936;
  border-radius:12px;
  overflow:hidden;
}
.card img{
  width:100%;
  height:270px;
  object-fit:cover;
}
.body{padding:13px}
.body h3{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-bottom:7px;
}
.info{
  color:#aaa;
  font-size:13px;
  margin-bottom:12px;
}
.watch{
  display:block;
  background:#ff326d;
  color:white;
  text-align:center;
  padding:10px;
  text-decoration:none;
  border-radius:7px;
}
.loading,.empty{
  text-align:center;
  padding:40px;
  color:#aaa;
}
#episodes{
  display:none;
  margin-top:40px;
}
.episode-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
  margin-top:20px;
}
.ep{
  background:#191923;
  border:1px solid #30303d;
  color:white;
  padding:13px;
  border-radius:7px;
  cursor:pointer;
}
.ep:hover{
  border-color:#ff326d;
}
footer{
  text-align:center;
  color:#777;
  padding:35px;
  border-top:1px solid #252532;
  margin-top:40px;
}
@media(max-width:600px){
  header{padding:13px 4%}
  nav a{font-size:12px;margin-left:8px}
  .hero{padding:60px 5%}
  main{padding:30px 4%}
  .search{flex-direction:column}
  button{padding:12px}
  .grid{grid-template-columns:repeat(2,1fr);gap:13px}
  .card img{height:230px}
}
</style>
</head>

<body>

<header>
  <div class="logo">AnimeHindi123</div>
  <nav>
    <a href="#home">Home</a>
    <a href="#anime">Anime</a>
  </nav>
</header>

<section class="hero" id="home">
  <div>
    <h1>Anime<span>Hindi123</span></h1>
    <p>
      Search anime, explore details and browse available episodes.
    </p>
    <a href="#anime" class="btn">Explore Anime</a>
  </div>
</section>

<main id="anime">

<h2>Anime Collection</h2>

<div class="search">
  <input
    id="search"
    placeholder="Search One Piece, Naruto, Pokémon..."
  >
  <button onclick="searchAnime()">Search</button>
</div>

<div id="loading" class="loading">
  Loading anime...
</div>

<div id="grid" class="grid"></div>

<div id="empty" class="empty" style="display:none">
  No anime found.
</div>

<section id="episodes">

  <h2 id="episodeTitle">Episodes</h2>

  <div id="episodeLoading" class="loading">
    Loading episodes...
  </div>

  <div id="episodeGrid" class="episode-grid"></div>

</section>

</main>

<footer>
© 2026 AnimeHindi123
</footer>

<script>

const API="https://api.jikan.moe/v4";

const grid=document.getElementById("grid");
const loading=document.getElementById("loading");
const empty=document.getElementById("empty");

async function request(url){

  const response=await fetch(url);

  if(!response.ok)
    throw new Error("API error");

  return await response.json();
}


/* LOAD POPULAR ANIME */

async function loadAnime(){

  loading.style.display="block";
  grid.innerHTML="";
  empty.style.display="none";

  try{

    const result=await request(
      API+"/top/anime?limit=24"
    );

    result.data.forEach(createCard);

  }catch(error){

    empty.textContent=
      "Anime could not be loaded. Refresh and try again.";

    empty.style.display="block";

  }

  loading.style.display="none";
}


/* SEARCH */

async function searchAnime(){

  const q=
    document.getElementById("search")
    .value.trim();

  if(!q){
    loadAnime();
    return;
  }

  loading.style.display="block";
  grid.innerHTML="";
  empty.style.display="none";

  try{

    const result=await request(
      API+"/anime?q="+
      encodeURIComponent(q)+
      "&limit=24"
    );

    if(!result.data.length){
      empty.textContent="No anime found.";
      empty.style.display="block";
    }

    result.data.forEach(createCard);

  }catch(error){

    empty.textContent=
      "Search failed. Please try again.";

    empty.style.display="block";

  }

  loading.style.display="none";
}


/* CARD */

function createCard(anime){

  const card=document.createElement("div");

  card.className="card";

  const image=
    anime.images?.jpg?.large_image_url ||
    anime.images?.jpg?.image_url ||
    "";

  const score=
    anime.score
    ? "⭐ "+anime.score
    : "⭐ N/A";

  const episodes=
    anime.episodes
    ? anime.episodes+" Episodes"
    : "Episodes unknown";

  card.innerHTML=`

    <img
      src="${image}"
      alt="${escapeHTML(anime.title)}"
      loading="lazy"
    >

    <div class="body">

      <h3 title="${escapeHTML(anime.title)}">
        ${escapeHTML(anime.title)}
      </h3>

      <div class="info">
        ${score} • ${episodes}
      </div>

      <a
        href="#episodes"
        class="watch"
        onclick="loadEpisodes(${anime.mal_id}, '${escapeJS(anime.title)}')"
      >
        ▶ Watch Now
      </a>

    </div>
  `;

  grid.appendChild(card);
}


/* EPISODES */

async function loadEpisodes(id,title){

  const section=document.getElementById("episodes");

  const episodeGrid=
    document.getElementById("episodeGrid");

  const episodeLoading=
    document.getElementById("episodeLoading");

  document.getElementById("episodeTitle")
    .textContent=title+" — Episodes";

  section.style.display="block";

  episodeGrid.innerHTML="";
  episodeLoading.style.display="block";

  section.scrollIntoView({
    behavior:"smooth"
  });

  try{

    const result=await request(
      API+"/anime/"+id+"/episodes"
    );

    if(!result.data.length){

      episodeGrid.innerHTML=
        "<p>No episode information available.</p>";

    }else{

      result.data.forEach(ep=>{

        const div=document.createElement("div");

        div.className="ep";

        div.innerHTML=`
          <b>Episode ${ep.mal_id ? ep.mal_id : ""}</b>
          <br>
          <small>
            ${escapeHTML(ep.title || "Episode")}
          </small>
        `;

        /*
          Jikan provides episode metadata.
          It does not provide a guaranteed full Hindi
          streaming URL for every episode.
        */

        div.onclick=()=>{

          if(ep.url){

            window.open(
              ep.url,
              "_blank",
              "noopener,noreferrer"
            );

          }else{

            alert(
              "A video source is not available for this episode."
            );

          }

        };

        episodeGrid.appendChild(div);

      });

    }

  }catch(error){

    episodeGrid.innerHTML=
      "<p>Episodes could not be loaded. Try again.</p>";

  }

  episodeLoading.style.display="none";
}


/* SECURITY HELPERS */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function escapeJS(text){

  return String(text)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,'\\"');

}


/* START */

loadAnime();

</script>

</body>
</html>
