<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>free anime.com — Watch Anime Online Free</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0e12;
  --surface: #16181f;
  --surface-hover: #20232e;
  --line: #262938;
  --text: #f1f1f6;
  --mute: #9ca3af;
  --primary: #7d5fff;
  --primary-hover: #6a4ff5;
  --accent: #00d2d3;
  --r: 12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px}

/* Header */
header{position:sticky;top:0;z-index:100;background:rgba(13,14,18,0.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:70px;gap:20px}
.logo{font-size:1.8rem;font-weight:800;letter-spacing:-0.5px;color:#fff}
.logo span{color:var(--primary)}
.search-bar{flex:1;max-width:500px;position:relative}
.search-bar input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:10px 20px 10px 45px;color:#fff;font-size:0.95rem;outline:none;transition:border .2s}
.search-bar input:focus{border-color:var(--primary)}
.search-bar svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);fill:var(--mute);width:18px;height:18px}
.nav-actions{display:flex;gap:15px;align-items:center}
.nav-btn{background:var(--surface);border:1px solid var(--line);padding:8px 16px;border-radius:99px;font-weight:600;font-size:0.9rem;transition:all .2s}
.nav-btn:hover{background:var(--primary);border-color:var(--primary);color:#fff}

/* Main Layout */
main{padding:30px 0 60px}
.section-title{font-size:1.4rem;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.section-title span{color:var(--primary)}

/* Catalog Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px}
.anime-card{background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);transition:transform .2s, border-color .2s;cursor:pointer;display:flex;flex-direction:column}
.anime-card:hover{transform:translateY(-5px);border-color:var(--primary)}
.poster{position:relative;aspect-ratio:3/4;background:#000;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.anime-card:hover .poster img{transform:scale(1.05)}
.badge-group{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap}
.badge{background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);padding:2px 8px;border-radius:4px;font-size:0.75rem;font-weight:700}
.badge.sub{background:var(--primary);color:#fff}
.badge.dub{background:var(--accent);color:#0c2a31}
.card-content{padding:12px;display:flex;flex-direction:column;flex:1}
.card-title{font-size:0.95rem;font-weight:700;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-info{font-size:0.8rem;color:var(--mute);margin-top:auto;display:flex;justify-content:space-between}

/* Watch Modal */
dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:0;width:min(1000px,96vw);max-height:92vh;overflow-y:auto;margin:auto}
dialog::backdrop{background:rgba(0,0,0,0.8);backdrop-filter:blur(5px)}
.modal-close{position:absolute;top:15px;right:15px;background:rgba(255,255,255,0.1);border:0;width:36px;height:36px;border-radius:50%;font-size:1.2rem;color:#fff;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--primary)}

/* Watch Player Container */
.watch-container{background:#000;position:relative;width:100%;aspect-ratio:16/9}
.watch-container iframe{width:100%;height:100%;border:0}
.watch-body{padding:25px}
.anime-heading{font-size:1.8rem;font-weight:800;margin-bottom:10px}
.anime-desc{color:var(--mute);font-size:0.95rem;margin-bottom:20px;max-height:100px;overflow-y:auto}

/* Server Selector Panel */
.servers-box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:15px;margin-bottom:20px}
.servers-title{font-size:0.85rem;font-weight:700;color:var(--mute);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.5px}
.server-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.server-label{font-weight:700;font-size:0.9rem;min-width:50px;color:var(--primary)}
.server-btn{background:var(--surface);border:1px solid var(--line);padding:6px 14px;border-radius:6px;font-size:0.85rem;font-weight:600;transition:all .2s}
.server-btn:hover,.server-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* Episode Buttons */
.episodes-box{margin-top:20px}
.episodes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px;max-height:200px;overflow-y:auto;padding-right:5px;margin-top:10px}
.ep-btn{background:var(--bg);border:1px solid var(--line);padding:8px;text-align:center;border-radius:6px;font-size:0.9rem;font-weight:600}
.ep-btn:hover,.ep-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}

.state{text-align:center;padding:50px;color:var(--mute);font-size:1.1rem}
@media(max-width:768px){.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="#" class="logo">free anime<span>.com</span></a>
    <div class="search-bar">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="search" placeholder="Search anime (e.g. Naruto, One Piece, Attack on Titan)..." autocomplete="off">
    </div>
    <div class="nav-actions">
      <button class="nav-btn">Watchlist</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="section-title">Trending <span>Anime</span></div>
  <div class="grid" id="anime-grid"></div>
  <div class="state" id="loading-state">Loading anime library...</div>
</main>

<dialog id="detail-modal">
  <button class="modal-close" onclick="document.getElementById('detail-modal').close()">✕</button>
  <div id="modal-content"></div>
</dialog>

<script>
const API = "https://graphql.anilist.co";
const grid = document.getElementById('anime-grid');
const loading = document.getElementById('loading-state');
const modal = document.getElementById('detail-modal');
const modalContent = document.getElementById('modal-content');

async function fetchAnime(search = "") {
  loading.style.display = 'block';
  grid.innerHTML = '';
  
  const query = `
    query ($search: String) {
      Page (page: 1, perPage: 30) {
        media (search: $search, type: ANIME, sort: POPULARITY_DESC) {
          id
          idMal
          title { romaji english }
          coverImage { large extraLarge }
          averageScore
          episodes
          status
          description
        }
      }
    }
  `;

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
      body: JSON.stringify({ query, variables: { search: search || undefined } })
    });
    const data = await res.json();
    const list = data.data.Page.media;
    
    loading.style.display = 'none';
    if(list.length === 0) {
      grid.innerHTML = '<div class="state" style="grid-column:1/-1">No anime found!</div>';
      return;
    }

    list.forEach(anime => {
      const title = anime.title.english || anime.title.romaji;
      const card = document.createElement('div');
      card.className = 'anime-card';
      card.innerHTML = `
        <div class="poster">
          <img src="${anime.coverImage.large}" loading="lazy" alt="${title}">
          <div class="badge-group">
            <span class="badge sub">SUB</span>
            <span class="badge dub">DUB</span>
          </div>
        </div>
        <div class="card-content">
          <div class="card-title">${title}</div>
          <div class="card-info">
            <span>⭐ ${anime.averageScore ? (anime.averageScore/10).toFixed(1) : 'N/A'}</span>
            <span>${anime.episodes ? anime.episodes + ' eps' : 'Ongoing'}</span>
          </div>
        </div>
      `;
      card.onclick = () => openWatchRoom(anime);
      grid.appendChild(card);
    });
  } catch (err) {
    loading.textContent = "Failed to load anime. Check connection.";
  }
}

function getSlug(title) {
  return title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

function openWatchRoom(anime) {
  const title = anime.title.english || anime.title.romaji;
  const malId = anime.idMal || anime.id;
  const slug = getSlug(title);
  const totalEps = anime.episodes || 24;

  const renderModal = (ep, provider) => {
    let embedUrl = "";

    // Updated Active Embed Routes (LiteSpeed error fix)
    if(provider === 'vidsrc-pro') {
      embedUrl = `https://vidsrc.me/embed/anime?id=${malId}&ep=${ep}`;
    } else if(provider === 'superembed') {
      embedUrl = `https://multiembed.mov/?video_id=${malId}&tmdb=1&s=1&e=${ep}`;
    } else if(provider === 'playerfx') {
      embedUrl = `https://vidsrc.pro/embed/anime/${malId}/${ep}`;
    } else if(provider === 'gogofast') {
      embedUrl = `https://emg.streamtape.com/e/${malId}`;
    }

    modalContent.innerHTML = `
      <div class="watch-container">
        <iframe src="${embedUrl}" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
      </div>
      <div class="watch-body">
        <div class="servers-box">
          <div class="servers-title">Streaming Servers (If stream buffers, switch server)</div>
          <div class="server-row">
            <span class="server-label">SUB:</span>
            <button class="server-btn ${provider==='vidsrc-pro'?'active':''}" onclick="switchServer(${ep}, 'vidsrc-pro')">Server 1 (VidSrc Pro)</button>
            <button class="server-btn ${provider==='superembed'?'active':''}" onclick="switchServer(${ep}, 'superembed')">Server 2 (SuperEmbed)</button>
            <button class="server-btn ${provider==='playerfx'?'active':''}" onclick="switchServer(${ep}, 'playerfx')">Server 3 (PlayerFX)</button>
          </div>
          <div class="server-row">
            <span class="server-label">DUB:</span>
            <button class="server-btn ${provider==='gogofast'?'active':''}" onclick="switchServer(${ep}, 'gogofast')">Server 4 (StreamTape)</button>
          </div>
        </div>

        <h2 class="anime-heading">${title} - Episode ${ep}</h2>
        <p class="anime-desc">${anime.description || 'No description available.'}</p>
        
        <div class="episodes-box">
          <div class="servers-title">Episodes</div>
          <div class="episodes-grid" id="ep-grid-list"></div>
        </div>
      </div>
    `;

    const epGridList = document.getElementById('ep-grid-list');
    for(let i=1; i<=Math.min(totalEps, 150); i++) {
      const eb = document.createElement('button');
      eb.className = `ep-btn ${i===ep?'active':''}`;
      eb.textContent = i;
      eb.onclick = () => renderModal(i, provider);
      epGridList.appendChild(eb);
    }
  };

  window.switchServer = (ep, provider) => {
    renderModal(ep, provider);
  };

  renderModal(1, 'vidsrc-pro');
  modal.showModal();
}

let timeout;
document.getElementById('search').addEventListener('input', (e) => {
  clearTimeout(timeout);
  timeout = setTimeout(() => {
    fetchAnime(e.target.value.trim());
  }, 500);
});

fetchAnime();
</script>

</body>
</html>
