<script>
const API = "https://api.jikan.moe/v4";

const grid = document.getElementById("grid");
const loading = document.getElementById("loading");
const empty = document.getElementById("empty");

async function getData(url) {
  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("API Error");
  }

  return await response.json();
}

async function loadPopular() {
  loading.style.display = "block";
  empty.style.display = "none";
  grid.innerHTML = "";

  try {
    const result = await getData(
      API + "/top/anime?limit=25"
    );

    if (!result.data || result.data.length === 0) {
      throw new Error("No anime found");
    }

    result.data.forEach(createCard);

  } catch (error) {
    console.log(error);

    empty.innerHTML = `
      <h3>Anime loading failed</h3>
      <p>Please refresh and try again.</p>
    `;

    empty.style.display = "block";
  }

  loading.style.display = "none";
}

async function searchAnime() {
  const query = document
    .getElementById("searchInput")
    .value
    .trim();

  if (!query) {
    loadPopular();
    return;
  }

  loading.style.display = "block";
  empty.style.display = "none";
  grid.innerHTML = "";

  try {
    const result = await getData(
      API + "/anime?q=" +
      encodeURIComponent(query) +
      "&limit=25"
    );

    if (!result.data || result.data.length === 0) {
      empty.innerHTML = `
        <h3>No anime found</h3>
        <p>Try another name.</p>
      `;
      empty.style.display = "block";
    } else {
      result.data.forEach(createCard);
    }

  } catch (error) {
    console.log(error);

    empty.innerHTML = `
      <h3>Search failed</h3>
      <p>Please try again.</p>
    `;

    empty.style.display = "block";
  }

  loading.style.display = "none";
}

function createCard(anime) {
  const card = document.createElement("div");
  card.className = "card";

  const image =
    anime.images?.jpg?.large_image_url ||
    anime.images?.jpg?.image_url ||
    "";

  const title = anime.title || "Unknown Anime";

  const score = anime.score
    ? "⭐ " + anime.score
    : "⭐ N/A";

  const episodes = anime.episodes
    ? anime.episodes + " Episodes"
    : "Episodes N/A";

  card.innerHTML = `
    <img
      src="${safe(image)}"
      alt="${safe(title)}"
      loading="lazy"
    >

    <div class="body">
      <h3 title="${safe(title)}">
        ${safe(title)}
      </h3>

      <div class="info">
        ${score} • ${episodes}
      </div>

      <a
        class="watch"
        href="#episodes"
        onclick="showEpisodes(${anime.mal_id}, '${safeJS(title)}')"
      >
        ▶ Watch Now
      </a>
    </div>
  `;

  grid.appendChild(card);
}

async function showEpisodes(id, title) {
  const section = document.getElementById("episodes");
  const episodeGrid = document.getElementById("episodeGrid");

  document.getElementById("episodeTitle").textContent =
    title + " — Episodes";

  section.style.display = "block";

  episodeGrid.innerHTML =
    '<div class="loading">Loading episodes...</div>';

  section.scrollIntoView({
    behavior: "smooth"
  });

  try {
    const result = await getData(
      API + "/anime/" + id + "/episodes"
    );

    episodeGrid.innerHTML = "";

    if (!result.data || result.data.length === 0) {
      episodeGrid.innerHTML =
        "<p>No episode information available.</p>";
      return;
    }

    result.data.forEach(ep => {
      const div = document.createElement("div");
      div.className = "episode";

      div.innerHTML = `
        <a
          href="${safe(ep.url || "#")}"
          target="_blank"
          rel="noopener noreferrer"
        >
          ▶ Episode ${ep.mal_id}
          <br>
          <small>${safe(ep.title || "Episode")}</small>
        </a>
      `;

      episodeGrid.appendChild(div);
    });

  } catch (error) {
    console.log(error);

    episodeGrid.innerHTML =
      "<p>Episodes could not be loaded.</p>";
  }
}

function safe(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function safeJS(text) {
  return String(text)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, '\\"');
}

document
  .getElementById("searchInput")
  .addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      searchAnime();
    }
  });

loadPopular();
</script>
