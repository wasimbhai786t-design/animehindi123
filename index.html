<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnimeHindi - Watch Anime Online</title>
  
  <!-- Plyr Video Player CSS -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  
  <style>
    :root {
      --bg-color: #0f0f13;
      --card-bg: #181820;
      --accent-color: #6366f1;
      --text-color: #e2e2e8;
      --text-muted: #8c8c9e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 15px;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #282835;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    /* Video Player Wrapper */
    .player-container {
      position: relative;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
    }

    video {
      width: 100%;
      max-height: 500px;
      display: block;
    }

    /* Episode Selector Grid */
    .episodes-box {
      background-color: var(--card-bg);
      margin-top: 15px;
      padding: 15px;
      border-radius: 8px;
    }

    .section-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .episode-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      max-height: 140px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .ep-btn {
      background-color: #23232f;
      color: var(--text-color);
      border: 1px solid #323242;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .ep-btn:hover {
      background-color: #2d2d3d;
    }

    .ep-btn.active {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
      color: #fff;
    }

    /* Anime Info Section */
    .anime-info {
      margin-top: 15px;
      background-color: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
    }

    .anime-title {
      font-size: 1.2rem;
      margin-bottom: 6px;
    }

    .anime-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">AnimeHindi</div>
    </header>

    <!-- Direct HTML5 Video Player with Plyr Controls -->
    <div class="player-container">
      <video id="player" playsinline controls data-poster=""></video>
    </div>

    <!-- Episodes List -->
    <div class="episodes-box">
      <div class="section-title">Episodes</div>
      <div class="episode-grid" id="episode-list">
        <!-- Dynamic Episodes Loaded via JS -->
      </div>
    </div>

    <!-- Details -->
    <div class="anime-info">
      <h1 class="anime-title" id="anime-title">Loading Anime...</h1>
      <p class="anime-desc" id="anime-desc">Please wait while we connect to the streaming server.</p>
    </div>
  </div>

  <!-- Scripts for HLS & Plyr Player -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

  <script>
    // Initialize Plyr Video Player
    const player = new Plyr('#player', { controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'] });

    // Public Consumet / Gogoanime API Base URL
    const API_BASE = "https://api.consumet.org/anime/gogoanime";
    
    // Default anime ID to load on startup (e.g., Attack on Titan / shingeki-no-kyojin)
    const animeId = "shingeki-no-kyojin";

    async function loadAnimeData() {
      try {
        const res = await fetch(`${API_BASE}/info/${animeId}`);
        const data = await res.json();

        document.getElementById('anime-title').innerText = data.title;
        document.getElementById('anime-desc').innerText = data.description || "No description available.";

        const episodeGrid = document.getElementById('episode-list');
        episodeGrid.innerHTML = "";

        data.episodes.forEach((ep) => {
          const btn = document.createElement('button');
          btn.className = `ep-btn ${ep.number === 1 ? 'active' : ''}`;
          btn.innerText = `EP ${ep.number}`;
          btn.onclick = () => {
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadEpisodeStream(ep.id);
          };
          episodeGrid.appendChild(btn);
        });

        // Load Episode 1 by default
        if (data.episodes.length > 0) {
          loadEpisodeStream(data.episodes[0].id);
        }
      } catch (err) {
        console.error("API Error:", err);
        document.getElementById('anime-title').innerText = "Connection Error";
        document.getElementById('anime-desc').innerText = "Could not reach streaming servers. Try refreshing in a moment.";
      }
    }

    async function loadEpisodeStream(episodeId) {
      try {
        const res = await fetch(`${API_BASE}/watch/${episodeId}`);
        const data = await res.json();
        
        // Find the best source (usually standard HLS .m3u8 link)
        const sourceUrl = data.sources.find(s => s.quality === 'default' || s.quality === '1040p' || s.quality === '720p')?.url || data.sources[0].url;

        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(sourceUrl);
          hls.attachMedia(player.media);
          window.hls = hls;
        } else if (player.media.canPlayType('application/vnd.apple.mpegurl')) {
          player.media.src = sourceUrl;
        }
      } catch (err) {
        console.error("Stream Error:", err);
      }
    }

    // Run on page load
    loadAnimeData();
  </script>
</body>
</html>
