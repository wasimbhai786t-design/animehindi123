<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AnimeHindi123 — Anime Discovery</title>
<meta name="description" content="AnimeHindi123 - Discover popular and latest anime.">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Helvetica,sans-serif;
background:#080a10;
color:#fff;
}

header{
position:sticky;
top:0;
z-index:100;
background:rgba(12,15,23,.97);
border-bottom:1px solid #252b3a;
padding:14px 5%;
backdrop-filter:blur(12px);
}

.nav{
max-width:1400px;
margin:auto;
display:flex;
align-items:center;
gap:25px;
}

.logo{
font-size:25px;
font-weight:900;
white-space:nowrap;
color:#ff3d71;
}

.logo span{color:#fff}

.search{
flex:1;
max-width:500px;
margin-left:auto;
background:#191e2a;
border:1px solid #303747;
border-radius:25px;
padding:12px 18px;
color:#fff;
outline:none;
font-size:15px;
}

.search:focus{border-color:#ff3d71}

.hero{
min-height:330px;
display:flex;
align-items:center;
padding:50px 6%;
background:
linear-gradient(90deg,#080a10 10%,rgba(8,10,16,.8),rgba(8,10,16,.25)),
radial-gradient(circle at 80% 40%,#57223f,#080a10 65%);
}

.hero-content{
max-width:700px;
}

.hero h1{
font-size:48px;
margin-bottom:15px;
}

.hero h1 span{color:#ff3d71}

.hero p{
color:#b4bbca;
line-height:1.7;
}

.container{
max-width:1400px;
margin:auto;
padding:30px 5%;
}

.section-title{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:20px;
}

.section-title h2{font-size:25px}

.section-title span{
color:#8992a5;
font-size:13px;
}

.grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:18px;
}

.card{
background:#121620;
border:1px solid #232a39;
border-radius:12px;
overflow:hidden;
cursor:pointer;
transition:.2s;
}

.card:hover{
transform:translateY(-5px);
border-color:#ff3d71;
}

.poster{
width:100%;
aspect-ratio:2/3;
object-fit:cover;
display:block;
background:#191d28;
}

.info{padding:12px}

.title{
font-size:14px;
font-weight:700;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
margin-bottom:8px;
}

.meta{
display:flex;
justify-content:space-between;
gap:5px;
color:#929aab;
font-size:12px;
}

.rating{color:#ffd15c}

.loading,
.error,
.empty{
text-align:center;
padding:45px 20px;
color:#aeb5c4;
}

button{
border:0;
cursor:pointer;
}

.action{
display:block;
margin:25px auto 5px;
padding:12px 22px;
border-radius:25px;
background:#ff3d71;
color:white;
font-weight:bold;
}

.action:disabled{
opacity:.5;
cursor:not-allowed;
}

.modal{
display:none;
position:fixed;
inset:0;
z-index:500;
background:rgba(0,0,0,.85);
padding:20px;
overflow:auto;
}

.modal.show{display:block}

.modal-box{
max-width:900px;
margin:35px auto;
background:#151925;
border:1px solid #303747;
border-radius:15px;
position:relative;
}

.close{
position:absolute;
right:15px;
top:12px;
width:38px;
height:38px;
border-radius:50%;
background:#272d3a;
color:white;
font-size:22px;
z-index:2;
}

.modal-content{
display:flex;
gap:25px;
padding:30px;
}

.modal-poster{
width:230px;
height:330px;
object-fit:cover;
border-radius:10px;
}

.modal-info{flex:1}

.modal-info h2{
font-size:29px;
padding-right:40px;
margin-bottom:15px;
}

.tags{
display:flex;
flex-wrap:wrap;
gap:8px;
margin:15px 0;
}

.tag{
background:#252b3a;
padding:6px 10px;
border-radius:15px;
font-size:12px;
color:#d1d6e0;
}

.synopsis{
color:#b6bdcb;
line-height:1.7;
font-size:14px;
}

footer{
margin-top:40px;
padding:30px;
text-align:center;
border-top:1px solid #222838;
color:#777f91;
font-size:13px;
}

@media(max-width:1100px){
.grid{grid-template-columns:repeat(4,1fr)}
}

@media(max-width:800px){
.grid{grid-template-columns:repeat(3,1fr)}
.hero h1{font-size:37px}
.modal-content{flex-direction:column}
.modal-poster{
width:180px;
height:260px;
margin:auto;
}
}

@media(max-width:560px){
header{padding:12px 4%}

.nav{
flex-direction:column;
gap:10px;
}

.search{
width:100%;
max-width:none;
}

.hero{
min-height:280px;
padding:35px 6%;
}

.hero h1{font-size:32px}

.container{
padding:25px 4%;
}

.grid{
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.modal-content{padding:20px}
}
</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo">
Anime<span>Hindi123</span>
</div>

<input
id="search"
class="search"
type="search"
placeholder="Search anime..."
autocomplete="off">

</div>
</header>

<section class="hero">

<div class="hero-content">

<h1>Discover <span>Anime</span></h1>

<p>
Explore popular, highly rated and latest anime.
Search anime and open detailed information instantly.
</p>

</div>

</section>

<main class="container">

<section>

<div class="section-title">
<h2>🔥 Popular Anime</h2>
<span id="count">Loading...</span>
</div>

<div id="grid" class="grid"></div>

<div id="loading" class="loading">
Loading anime...
</div>

<div id="error" class="error" style="display:none">
Anime could not be loaded.
<br>
<button class="action" onclick="start()">Try Again</button>
</div>

<button
id="loadMore"
class="action"
style="display:none">
Load More Anime
</button>

</section>

</main>

<div id="modal" class="modal">

<div class="modal-box">

<button id="close" class="close">×</button>

<div class="modal-content">

<img
id="modalPoster"
class="modal-poster"
src=""
alt="Anime poster">

<div class="modal-info">

<h2 id="modalTitle">Anime</h2>

<div class="tags">

<span id="modalYear" class="tag"></span>

<span id="modalScore" class="tag"></span>

<span id="modalEpisodes" class="tag"></span>

<span id="modalStatus" class="tag"></span>

</div>

<p id="modalGenres" class="synopsis"></p>

<br>

<p id="modalSynopsis" class="synopsis">
No description available.
</p>

</div>

</div>

</div>

</div>

<footer>
AnimeHindi123 © 2026 — Anime Discovery
</footer>
<script>
const JIKAN = "https://api.jikan.moe/v4";
const KITSU = "https://kitsu.io/api/edge";

const grid = document.getElementById("grid");
const loading = document.getElementById("loading");
const errorBox = document.getElementById("error");
const count = document.getElementById("count");
const search = document.getElementById("search");
const loadMore = document.getElementById("loadMore");
const modal = document.getElementById("modal");

let page = 1;
let allAnime = [];
let searchTimer = null;

/* =========================
   FETCH WITH TIMEOUT
========================= */

async function fetchJSON(url, timeout = 10000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);

  try {
    const response = await fetch(url, {
      signal: controller.signal,
      headers: {
        "Accept": "application/json"
      }
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    return await response.json();

  } finally {
    clearTimeout(timer);
  }
}

/* =========================
   POSTER
========================= */

function getPoster(anime) {
  return anime.poster ||
    anime.images?.webp?.large_image_url ||
    anime.images?.jpg?.large_image_url ||
    anime.images?.webp?.image_url ||
    anime.images?.jpg?.image_url ||
    "https://placehold.co/400x600/151925/ffffff?text=Anime";
}

/* =========================
   NORMALIZE KITSU
========================= */

function normalizeKitsu(item) {
  const a = item.attributes || {};

  return {
    mal_id: "kitsu-" + item.id,
    title: a.titles?.en_jp ||
           a.titles?.en ||
           a.titles?.ja_jp ||
           a.canonicalTitle ||
           "Unknown Anime",

    poster:
      a.posterImage?.large ||
      a.posterImage?.medium ||
      a.posterImage?.small ||
      "",

    year: a.startDate
      ? new Date(a.startDate).getFullYear()
      : "N/A",

    score: a.averageRating
      ? Number(a.averageRating) / 10
      : null,

    episodes: a.episodeCount || null,

    status: a.status || "Unknown",

    synopsis:
      a.synopsis ||
      "No description available.",

    genres: []
  };
}

/* =========================
   LOAD POPULAR
========================= */

async function loadPopular() {

  loading.style.display = "block";
  errorBox.style.display = "none";

  try {

    /* First try Jikan */
    try {

      const url =
        JIKAN +
        "/top/anime?filter=bypopularity&page=" +
        page +
        "&limit=25&sfw=true";

      const data = await fetchJSON(url, 9000);

      if (data && Array.isArray(data.data) && data.data.length) {

        addAnime(data.data);

        loading.style.display = "none";

        loadMore.style.display =
          data.pagination?.has_next_page ? "block" : "none";

        return;
      }

    } catch (jikanError) {
      console.log("Jikan failed, trying backup API...");
    }

    /* Backup API */
    const offset = (page - 1) * 25;

    const backupURL =
      KITSU +
      "/anime?page[limit]=25&page[offset]=" +
      offset +
      "&sort=-averageRating";

    const backup = await fetchJSON(backupURL, 10000);

    const backupAnime =
      (backup.data || []).map(normalizeKitsu);

    if (!backupAnime.length) {
      throw new Error("No anime received");
    }

    addAnime(backupAnime);

    loading.style.display = "none";
    loadMore.style.display =
      backupAnime.length >= 25 ? "block" : "none";

  } catch (error) {

    console.error("Anime loading failed:", error);

    loading.style.display = "none";
    errorBox.style.display = "block";

    count.textContent = "Unable to load";

  }
}

/* =========================
   ADD ANIME
========================= */

function addAnime(list) {

  const existing = new Set(
    allAnime.map(a => String(a.mal_id))
  );

  list.forEach(anime => {

    const id = String(anime.mal_id);

    if (!existing.has(id)) {
      allAnime.push(anime);
      existing.add(id);
    }

  });

  render(allAnime);
}

/* =========================
   CREATE CARD
========================= */

function createCard(anime) {

  const card = document.createElement("article");
  card.className = "card";

  const img = document.createElement("img");

  img.className = "poster";
  img.loading = "lazy";
  img.alt = anime.title || "Anime";
  img.src = getPoster(anime);

  img.onerror = function() {
    this.onerror = null;
    this.src =
      "https://placehold.co/400x600/151925/ffffff?text=Anime";
  };

  const info = document.createElement("div");
  info.className = "info";

  const title = document.createElement("div");
  title.className = "title";
  title.textContent =
    anime.title || "Unknown Anime";

  const meta = document.createElement("div");
  meta.className = "meta";

  const year =
    anime.year ||
    anime.aired?.prop?.from?.year ||
    "N/A";

  const score =
    anime.score
      ? "⭐ " + Number(anime.score).toFixed(1)
      : "⭐ N/A";

  meta.innerHTML =
    "<span>" + year + "</span>" +
    "<span class='rating'>" + score + "</span>";

  info.appendChild(title);
  info.appendChild(meta);

  card.appendChild(img);
  card.appendChild(info);

  card.onclick = function() {
    openModal(anime);
  };

  return card;
}

/* =========================
   RENDER
========================= */

function render(list) {

  grid.innerHTML = "";

  if (!list.length) {

    grid.innerHTML =
      "<div class='empty'>No anime found.</div>";

    count.textContent = "0 anime";

    return;
  }

  const fragment =
    document.createDocumentFragment();

  list.forEach(anime => {
    fragment.appendChild(
      createCard(anime)
    );
  });

  grid.appendChild(fragment);

  count.textContent =
    list.length + " anime";
}

/* =========================
   START
========================= */

async function start() {

  page = 1;
  allAnime = [];

  grid.innerHTML = "";

  count.textContent = "Loading...";

  loading.style.display = "block";
  errorBox.style.display = "none";
  loadMore.style.display = "none";

  await loadPopular();
}

/* =========================
   LOAD MORE
========================= */

loadMore.onclick = async function() {

  if (loadMore.disabled) return;

  loadMore.disabled = true;
  loadMore.textContent = "Loading...";

  page++;

  try {

    await loadPopular();

  } catch (error) {

    page--;

  } finally {

    loadMore.disabled = false;
    loadMore.textContent =
      "Load More Anime";

  }
};

/* =========================
   SEARCH
========================= */

search.addEventListener("input", function() {

  clearTimeout(searchTimer);

  const query =
    this.value.trim();

  if (!query) {

    render(allAnime);

    return;
  }

  searchTimer = setTimeout(async function() {

    loading.style.display = "block";
    errorBox.style.display = "none";

    try {

      /* Jikan search */

      try {

        const url =
          JIKAN +
          "/anime?q=" +
          encodeURIComponent(query) +
          "&limit=25&sfw=true";

        const data =
          await fetchJSON(url, 9000);

        const results =
          data.data || [];

        if (results.length) {

          grid.innerHTML = "";

          const fragment =
            document.createDocumentFragment();

          results.forEach(anime => {
            fragment.appendChild(
              createCard(anime)
            );
          });

          grid.appendChild(fragment);

          count.textContent =
            results.length + " results";

          loading.style.display = "none";

          return;
        }

      } catch (e) {
        console.log("Jikan search failed");
      }

      /* Kitsu search backup */

      const backupURL =
        KITSU +
        "/anime?filter[text]=" +
        encodeURIComponent(query) +
        "&page[limit]=25";

      const backup =
        await fetchJSON(backupURL, 10000);

      const results =
        (backup.data || [])
          .map(normalizeKitsu);

      grid.innerHTML = "";

      if (!results.length) {

        grid.innerHTML =
          "<div class='empty'>No anime found.</div>";

        count.textContent =
          "0 results";

      } else {

        const fragment =
          document.createDocumentFragment();

        results.forEach(anime => {
          fragment.appendChild(
            createCard(anime)
          );
        });

        grid.appendChild(fragment);

        count.textContent =
          results.length + " results";
      }

    } catch (error) {

      console.error(error);

      grid.innerHTML =
        "<div class='empty'>" +
        "Search failed. Please try again." +
        "</div>";

      count.textContent =
        "Search error";

    } finally {

      loading.style.display = "none";

    }

  }, 450);

});

/* =========================
   MODAL
========================= */

function openModal(anime) {

  document.getElementById(
    "modalPoster"
  ).src = getPoster(anime);

  document.getElementById(
    "modalTitle"
  ).textContent =
    anime.title || "Unknown Anime";

  const year =
    anime.year ||
    anime.aired?.prop?.from?.year ||
    "N/A";

  document.getElementById(
    "modalYear"
  ).textContent =
    "Year: " + year;

  document.getElementById(
    "modalScore"
  ).textContent =
    anime.score
      ? "⭐ " + Number(anime.score).toFixed(1)
      : "⭐ N/A";

  document.getElementById(
    "modalEpisodes"
  ).textContent =
    anime.episodes
      ? anime.episodes + " Episodes"
      : "Episode N/A";

  document.getElementById(
    "modalStatus"
  ).textContent =
    anime.status || "Status N/A";

  const genres =
    (anime.genres || [])
      .map(g => g.name)
      .join(" • ");

  document.getElementById(
    "modalGenres"
  ).textContent =
    genres
      ? "Genres: " + genres
      : "Genres: N/A";

  document.getElementById(
    "modalSynopsis"
  ).textContent =
    anime.synopsis ||
    "No description available.";

  modal.classList.add("show");

  document.body.style.overflow =
    "hidden";
}

/* =========================
   CLOSE MODAL
========================= */

function closeModal() {

  modal.classList.remove("show");

  document.body.style.overflow = "";
}

document.getElementById(
  "close"
).onclick = closeModal;

modal.onclick = function(event) {

  if (event.target === modal) {
    closeModal();
  }

};

document.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Escape") {
      closeModal();
    }

  }
);

/* =========================
   RUN WEBSITE
========================= */

start();

</script>
