<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AnimeHindi123 - Anime Discovery</title>
  <meta name="description" content="AnimeHindi123 - Discover popular anime, search anime and explore anime details.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #090b12;
      --card: #111522;
      --card2: #171b2b;
      --text: #ffffff;
      --muted: #9ca3b4;
      --accent: #ff3158;
      --accent2: #ff6682;
      --border: rgba(255,255,255,.08);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9,11,18,.92);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      max-width: 1200px;
      margin: auto;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      white-space: nowrap;
    }

    .logo span {
      color: var(--accent);
    }

    .search {
      flex: 1;
      display: flex;
      gap: 8px;
    }

    .search input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 12px;
      border: 1px solid var(--border);
      outline: none;
      background: var(--card);
      color: white;
      font-size: 15px;
    }

    .search button,
    .btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .search button:hover,
    .btn:hover {
      background: var(--accent2);
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 30px 20px 50px;
    }

    .hero {
      min-height: 280px;
      padding: 35px;
      border-radius: 22px;
      background:
        linear-gradient(90deg, rgba(0,0,0,.85), rgba(0,0,0,.35)),
        linear-gradient(135deg, #27101a, #111827);
      display: flex;
      align-items: center;
      margin-bottom: 35px;
      border: 1px solid var(--border);
    }

    .hero-content {
      max-width: 650px;
    }

    .hero h1 {
      font-size: clamp(32px, 6vw, 58px);
      line-height: 1;
      margin-bottom: 15px;
    }

    .hero p {
      color: #d1d5db;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin: 30px 0 18px;
    }

    .section-head h2 {
      font-size: 25px;
    }

    .status {
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      overflow: hidden;
      transition: .2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(255,49,88,.5);
    }

    .poster-wrap {
      position: relative;
      aspect-ratio: 2 / 3;
      background: #151923;
      overflow: hidden;
    }

    .poster {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .score {
      position: absolute;
      top: 9px;
      right: 9px;
      background: rgba(0,0,0,.78);
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }

    .card-body {
      padding: 12px;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      min-height: 40px;
      margin-bottom: 7px;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 10px;
    }

    .card-actions {
      display: flex;
      gap: 7px;
    }

    .card-actions a,
    .card-actions button {
      flex: 1;
      text-align: center;
      padding: 8px 6px;
      border-radius: 8px;
      border: 0;
      background: var(--card2);
      color: white;
      font-size: 12px;
      cursor: pointer;
    }

    .card-actions a.primary {
      background: var(--accent);
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 50px 20px;
      color: var(--muted);
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid #292d39;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .details {
      display: none;
      margin-top: 30px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 25px;
    }

    .details.active {
      display: block;
    }

    .details-grid {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 25px;
    }

    .details img {
      width: 100%;
      border-radius: 12px;
    }

    .details h2 {
      margin-bottom: 10px;
    }

    .details p {
      color: #c4c8d3;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 12px 0;
    }

    .chip {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 10px;
      color: #d5d8e0;
      font-size: 12px;
    }

    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 25px 20px;
      color: var(--muted);
      font-size: 13px;
      margin-top: 20px;
    }

    @media (max-width: 1000px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 720px) {
      .nav {
        flex-wrap: wrap;
      }

      .logo {
        width: 100%;
      }

      .hero {
        padding: 25px;
      }

      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .details-grid {
        grid-template-columns: 120px 1fr;
        gap: 15px;
      }
    }

    @media (max-width: 420px) {
      main {
        padding: 20px 12px 40px;
      }

      .hero {
        min-height: 230px;
      }

      .hero h1 {
        font-size: 34px;
