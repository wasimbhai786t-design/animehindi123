<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnimeHindi - Watch Anime Online</title>
  <style>
    :root {
      --bg-color: #0f0f13;
      --card-bg: #181820;
      --accent-color: #6366f1;
      --text-color: #e2e2e8;
      --text-muted: #8c8c9e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 15px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #282835;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    /* Player Wrapper */
    .player-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }

    .player-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Server Box matching AniWave style */
    .server-box {
      background-color: var(--card-bg);
      margin-top: 15px;
      padding: 15px;
      border-radius: 8px;
    }

    .server-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .server-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .server-label {
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--accent-color);
      min-width: 45px;
    }

    .server-btn {
      background-color: #23232f;
      color: var(--text-color);
      border: 1px solid #323242;
      padding: 7px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s ease;
    }

    .server-btn:hover {
      background-color: #2d2d3d;
    }

    .server-btn.active {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
      color: #fff;
    }

    .anime-info {
      margin-top: 15px;
      background-color: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
    }

    .anime-title {
      font-size: 1.2rem;
      margin-bottom: 6px;
    }

    .anime-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">AnimeHindi</div>
    </header>

    <!-- Video Player Frame -->
    <div class="player-wrapper">
      <iframe id="anime-player" src="" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
    </div>

    <!-- Server Controls -->
    <div class="server-box">
      <div class="server-title">Select Server (If video shows unavailable, switch server)</div>
      
      <div class="server-group">
        <span class="server-label">SUB:</span>
        <button class="server-btn active" onclick="switchServer('https://vidsrc.xyz/embed/anime/tt11234342/1-1', this)">MegaCloud (HD)</button>
        <button class="server-btn" onclick="switchServer('https://multiembed.mov/?video_id=tt11234342&s=1&e=1', this)">VidStream (Fast)</button>
        <button class="server-btn" onclick="switchServer('https://iframe.grandmaster.quest/embed/anime/37854/1', this)">Anitaku (Alt)</button>
      </div>

      <div class="server-group">
        <span class="server-label">DUB:</span>
        <button class="server-btn" onclick="switchServer('https://vidsrc.to/embed/anime/37854/1', this)">Server Dub</button>
      </div>
    </div>

    <!-- Anime Meta Info -->
    <div class="anime-info">
      <h1 class="anime-title">Attack on Titan - Episode 1</h1>
      <p class="anime-desc">Several hundred years ago, humans were nearly exterminated by titans. Titans are typically several stories tall, seem to have no intelligence, devour...</p>
    </div>
  </div>

  <script>
    const iframe = document.getElementById('anime-player');

    function switchServer(url, btn) {
      // Update button active states
      document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      // Change iframe source
      iframe.src = url;
    }

    // Set default initial server load on page open
    iframe.src = 'https://vidsrc.xyz/embed/anime/tt11234342/1-1';
  </script>

</body>
</html>
